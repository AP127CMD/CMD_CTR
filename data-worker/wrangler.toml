name = "ap127-data"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Stateless proxy in front of raw.githubusercontent.com. Re-serves the AP127
# data files (flight-data.js, flight-data-recent.js, cache.json) with a
# browser-usable Content-Type + a 60s edge cache, so data commits no longer
# trigger a Cloudflare Pages rebuild. No bindings, no storage, no secrets.
# See ../docs/superpowers/specs/2026-09-06-r2-data-plane-decoupling-design.md

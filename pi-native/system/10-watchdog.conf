# -> /etc/systemd/system.conf.d/10-watchdog.conf   (then: systemctl daemon-reexec)
[Manager]
# Arm the SoC hardware watchdog (sunxi-wdt). It exists but was never armed
# (RuntimeWatchdogUSec=0), so a memory-thrash lockup on this 1 GB board stayed
# hung until someone power-cycled it (17 h on 2026-09-06, ~10 min on 2026-10-19).
# systemd pets it every few seconds; if PID 1 stops running, the board resets.
# The chip hard-caps at 16 s — 30 s is REJECTED ("Invalid argument") and silently
# leaves the watchdog unarmed. Verify: journalctl -b | grep "Watchdog running".
RuntimeWatchdogSec=16
WatchdogDevice=/dev/watchdog

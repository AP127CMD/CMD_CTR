# /etc/systemd/journald.conf.d/10-ap127-persist.conf
# Size-capped persistent journal (lives on the SD card via var-log-journal.mount).
# Evidence for the next hang: OOM kills, kernel errors, "Failed to fork", watchdog resets.
[Journal]
Storage=persistent
# ~2 MB/day measured, so 48 MB is weeks of history; the caps stop it ever filling the SD card.
SystemMaxUse=48M
SystemMaxFileSize=8M
SystemKeepFree=500M
MaxRetentionSec=1month
# Non-critical entries are flushed to disk at most this often. Kernel OOM messages are only
# err-level (not crit), so the default 5 min could lose the last minutes before a hard hang.
SyncIntervalSec=30s

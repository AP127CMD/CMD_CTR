# -> /etc/systemd/system/cups.service.d/limits.conf
[Service]
# Print rendering (pdftopdf -> pdftoraster -> rastertogutenprint) on a 1 GB board that also holds
# Chromium (~620 MB). MEASURED 2026-10-20 with these exact guard rails:
#   typical page (12-48 MP photo or text)  310-316 MB peak, ~27 s/page   (image size barely matters)
#   94 MB, 8-page photo PDF                434 MB peak, 3m32s            (file size is what grows it)
# so MemoryMax=450M fits ~100 MB PDFs; anything bigger is killed in seconds and the job simply
# fails — it can never take the board down.
#
# NO MemoryHigh. A soft throttle (tried at 200M) made big jobs thrash instead of fail: a 48 MP page
# sat 5 min at 5% CPU, throttled 12,575 times, never finishing, never dying. A hard ceiling that
# kills is strictly better than a throttle that crawls.
Nice=10
CPUWeight=30
IOWeight=30
OOMScoreAdjust=300
MemoryMax=450M
# Keep one job from filling the 484 MB zram swap that Chromium's idle pages also live in.
MemorySwapMax=250M

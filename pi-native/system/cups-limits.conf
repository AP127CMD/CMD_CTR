# -> /etc/systemd/system/cups.service.d/limits.conf
[Service]
# Print rendering (pdftoraster + rastertogutenprint) peaks ~270 MB and holds it for the
# ~90 s the printer takes to print. It must never starve sshd or the scraper on this 1 GB
# board: low CPU/IO priority, throttled (never killed) above 200 MB, and first in line for
# the OOM killer (Chromium is +100, sshd is -1000).
Nice=10
CPUWeight=30
IOWeight=30
OOMScoreAdjust=300
MemoryHigh=200M

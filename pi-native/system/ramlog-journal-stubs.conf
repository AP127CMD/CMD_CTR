# /etc/systemd/system/dietpi-ramlog.service.d/ap127-journal-stubs.conf
# DietPi's RAMlog restore (`cp -an --attributes-only`) re-creates 0-byte stubs of old journal file names
# in /var/log/journal after a CLEAN shutdown; journald then warns "truncated, ignoring file" on every
# journalctl call. Delete them right after the restore. A live journal file is never 0 bytes (preallocated).
[Service]
ExecStartPost=/usr/bin/find /var/log/journal -type f -name '*.journal*' -size 0 -delete

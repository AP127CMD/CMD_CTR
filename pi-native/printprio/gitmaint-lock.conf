# -> /etc/systemd/system/ap127-gitmaint.service.d/lock.conf
[Service]
# The repack must not overlap a fetch or the readiness planner either. Waits up to 30 min (it runs
# at 03:30, when nothing else matters); the fetch skips cycles while it runs (run_fetch.sh guard).
ExecStart=
ExecStart=/usr/bin/flock -w 1800 -E 0 /run/lock/ap127-heavy.lock /home/dietpi/flight-schedule-feed/pi-native/maintenance/ap127-gitmaint.sh
TimeoutStartSec=3000

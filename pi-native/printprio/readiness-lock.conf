# -> /etc/systemd/system/ap127-readiness.service.d/lock.conf
[Service]
# Take turns with the fetch / repack. -E 0: if the lock is still busy after 5 min, skip this run
# quietly (it fires again in 15 min) instead of marking the unit failed.
ExecStart=
ExecStart=/usr/bin/flock -w 300 -E 0 /run/lock/ap127-heavy.lock /home/dietpi/flight-schedule-feed/pi-native/readiness/.venv/bin/python -m readiness
TimeoutStartSec=420

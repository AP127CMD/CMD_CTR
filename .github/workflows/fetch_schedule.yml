name: Fetch Flight Schedule & Deploy

on:
  schedule:
    # Unguarded CLOUD PROOF RUN, twice a day. 2026-09-02: the Pi is primary and
    # the CF dispatcher now only dispatches this workflow when the published
    # feed is >= 35 min stale, so on a healthy day CI fetches nothing. A
    # fallback that never executes is a fallback nobody knows is broken, so
    # these two runs exercise the whole CI path (Playwright, portal RPC, push,
    # CMDV2 dispatch) on a schedule instead of first discovering it rotted
    # during an actual Pi outage. Was '0 * * * *' when CI was primary.
    - cron: '0 */12 * * *'
  workflow_dispatch:          # manual trigger from GitHub UI, or the CF dispatcher
    inputs:
      force:
        description: 'Bypass the portal-outage backoff and fetch right now'
        type: boolean
        default: false

# 2026-07-27: a single run took 6-11 min under the original two-pass Timeline
# DOM-scraping fetch (since replaced with one getStudentSchedule RPC call per
# date — see docs/superpowers/specs/2026-07-27-rpc-based-schedule-fetch-
# design.md; a live verification run of the new mechanism took ~10 min for 18
# dates, ~33s/date, since every CI run is a fresh browser session so every
# date is a cold RPC call),
# but the CF Worker dispatcher fires a new run every 5 min. With no
# concurrency guard, that means 2-3 independent Playwright scraper instances
# were ALWAYS running in parallel (confirmed live: runs #14111/#14112 started
# 2 seconds apart; every consecutive run's start-to-end window overlapped the
# next trigger for the whole day sampled). Each push races the others via the
# retry-with-rebase logic below, which lands every commit but does nothing to
# stop each run from independently reading its OWN possibly-stale
# window.G.flights snapshot -- so the merged file kept flip-flopping a
# booking's status between whatever two runs happened to interleave last.
# That surfaced downstream as real notification spam (AP127_V2/watchdog fired
# duplicate Pending<->Canceled STATUS events for 36+ bookings in one day, zero
# actually re-cancelled). This queues instead of parallelizing: a new trigger
# arriving mid-run waits for the current one to finish rather than starting a
# second scrape against the same file. `cancel-in-progress: false` (not
# `true`) is deliberate -- cancelling the in-progress run instead would mean
# a run this length practically never finishes since a new trigger arrives
# before ~5 min every time.
concurrency:
  group: fetch-schedule
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Checkout runs unconditionally and first — the backoff check right
      # after it needs data/backoff_state.json from the repo.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2026-08-25: the Ops Portal itself went unresponsive for 7.5+ hours
      # (Playwright's wait for userHtmlFrame never completed) while the CF
      # dispatcher kept firing a fresh run every 5 min regardless — ~90
      # consecutive failed runs, each burning a full Playwright session
      # against an already-struggling portal. This step short-circuits the
      # rest of the job once we've been failing for a while, so a sustained
      # portal outage doesn't keep getting hammered every 5 min. `force: true`
      # (manual dispatch only — the CF dispatcher never sets it) bypasses it.
      #
      # Reads data/backoff_state.json (written by scripts/fetch_schedule.py's
      # main_with_retry() after every run — reset to 0 on success, incremented
      # on a fully-exhausted failure) rather than reconstructing anything from
      # GitHub Actions run history. That was the first design tried, and it
      # had a real bug: a SKIPPED run's own conclusion is "success" (no step
      # failed), which is indistinguishable from a genuinely successful fetch
      # when read back from `gh api .../runs` — the very first skip reset the
      # apparent streak to 0, so the next trigger 5 min later saw "no failures"
      # and retried immediately, hammering the portal again after exactly one
      # throttled cycle. Persisted state has no such ambiguity.
      - name: Check portal-outage backoff
        id: backoff
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "Manual force-run — skipping backoff check."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -f data/backoff_state.json ]; then
            echo "No backoff state on disk yet — retrying normally."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STREAK=$(jq -r '.consecutiveFailures // 0' data/backoff_state.json)
          LAST_ATTEMPT=$(jq -r '.lastAttemptAt // empty' data/backoff_state.json)

          echo "Consecutive prior failures: $STREAK (last attempt: ${LAST_ATTEMPT:-none})"

          if [ "$STREAK" -lt 6 ] || [ -z "$LAST_ATTEMPT" ]; then
            echo "Under ~30 min of failures — retry normally."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Sustained outage: throttle how often we actually hit the portal.
          # 30-90 min down -> retry roughly every 15 min. 90+ min -> every 30 min.
          if [ "$STREAK" -lt 18 ]; then MIN_GAP_S=900; else MIN_GAP_S=1800; fi

          LAST_EPOCH=$(date -u -d "$LAST_ATTEMPT" +%s)
          NOW_EPOCH=$(date -u +%s)
          ELAPSED=$((NOW_EPOCH - LAST_EPOCH))

          if [ "$ELAPSED" -lt "$MIN_GAP_S" ]; then
            echo "::notice::Portal has failed $STREAK straight runs — backing off (last attempt ${ELAPSED}s ago, need ${MIN_GAP_S}s). Skipping this run rather than hammering an unresponsive portal."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Backoff window elapsed (${ELAPSED}s >= ${MIN_GAP_S}s) — retrying."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skipped this run — portal-outage backoff active
        if: steps.backoff.outputs.skip == 'true'
        run: echo "::notice::No fetch attempted this run — see 'Check portal-outage backoff' step above for the streak/timing."

      - name: Set up Python
        if: steps.backoff.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        if: steps.backoff.outputs.skip != 'true'
        run: pip install -r requirements.txt

      # Cache the Playwright browser binary — avoids a ~200 MB download every run.
      # Cache key includes the Playwright version so it rebuilds after upgrades.
      - name: Cache Playwright browsers
        if: steps.backoff.outputs.skip != 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}

      # Always run --with-deps so OS packages are present.
      # When the cache is warm the binary already exists and Playwright skips
      # the download — making this step take ~10 s instead of ~2 min.
      - name: Install Playwright browser
        if: steps.backoff.outputs.skip != 'true'
        run: playwright install chromium --with-deps

      # Fetch with up to 3 attempts before failing the job.
      - name: Fetch flight schedule
        if: steps.backoff.outputs.skip != 'true'
        id: fetch
        run: python scripts/fetch_schedule.py
        env:
          FETCH_MAX_ATTEMPTS: '3'
          FETCH_RETRY_DELAY: '20'

      - name: Generate flight-data.js
        if: steps.backoff.outputs.skip != 'true'
        run: python scripts/generate_flight_data.py

      # Push with retry to survive concurrent runs (cron + dispatcher + manual
      # overlap). On a non-fast-forward rejection we replay our single commit on
      # top of the new remote tip, always keeping OUR freshly generated data
      # (`-X theirs` resolves any conflict on the regenerated file in our favour).
      #
      # Runs on `always()` (not just success) — unlike the other data files,
      # data/backoff_state.json is meant to be committed EVEN WHEN the fetch
      # failed, since that's exactly when its updated consecutiveFailures/
      # lastAttemptAt matters for the next run's backoff decision. The other
      # files are untouched on a failed run (fetch_schedule.py never reaches
      # its OUTPUT_FILE.write_text() when the whole run fails this early —
      # userHtmlFrame never even appears — so `git add`ing them is harmless).
      - name: Commit updated data
        if: always() && steps.backoff.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/flight_schedule.json flight-data.js flight-data-recent.js data/portal_fingerprint.json
          if [ -f data/backoff_state.json ]; then git add data/backoff_state.json; fi
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
          else
            git commit -m "chore: update flight data $(date -u +%Y-%m-%dT%H:%M:%SZ) [CI Skip]"
            for attempt in 1 2 3 4 5; do
              if git push origin main; then
                echo "Pushed on attempt $attempt"; break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::push failed after 5 attempts"; exit 1
              fi
              echo "Push rejected — syncing with remote (attempt $attempt)…"
              git fetch origin main
              git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
              sleep $((attempt * 3))
            done
          fi

      # Trigger CMDV2 refresh now that CMD_CTR has fresh flight-data.js committed.
      # By the time Playwright + scrape finishes (~3–4 min), DB001 is also done
      # so CMDV2 gets fresh data from both upstream sources in one shot.
      - name: Trigger CMDV2 refresh
        if: success() && steps.backoff.outputs.skip != 'true'
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_PAT_WORKFLOW }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/AP127CMD/CMDV2/actions/workflows/refresh-data.yml/dispatches \
            -d '{"ref":"main"}'
          echo "CMDV2 refresh-data.yml dispatched"

      # Push-trigger the watchdog so a schedule change reaches Telegram in
      # seconds rather than on its next */2 cron tick. Non-fatal.
      - name: Notify watchdog
        if: success() && steps.backoff.outputs.skip != 'true'
        env:
          WATCHDOG_NOTIFY_KEY: ${{ secrets.WATCHDOG_NOTIFY_KEY }}
        run: |
          [ -n "$WATCHDOG_NOTIFY_KEY" ] || { echo "key unset — skipping"; exit 0; }
          curl -fsS -m 15 -X POST -H "X-API-Key: $WATCHDOG_NOTIFY_KEY" \
            https://ap127-watchdog.anusorn-tanmetha.workers.dev/notify >/dev/null \
            && echo "watchdog notified" || echo "::warning::watchdog /notify failed"

      # Open a GitHub issue when this run fails so stale data doesn't go unnoticed.
      - name: Report failure as GitHub issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[Fetch] Run failed – ${new Date().toISOString().slice(0,16)} UTC`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'fetch-failure',
            });
            // Don't open a duplicate if one is already open.
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title,
                body: `Workflow run failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nCheck logs and re-run manually once fixed.`,
                labels: ['fetch-failure'],
              });
            }

      # Auto-close a stale fetch-failure issue once a run succeeds again. The
      # step above only opens a NEW issue if none is already open, which means
      # an issue nobody closed silently swallows every future alert forever —
      # exactly what happened 2026-07-18→08-25: issue #8 sat open for 5+
      # weeks, so a real 7.5h portal outage on 08-25 generated zero fresh
      # alerts (only bare per-run GitHub Actions failure emails). Closing it
      # here as soon as we're healthy again keeps the dedup check meaningful.
      - name: Close stale fetch-failure issue on success
        if: success() && steps.backoff.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'fetch-failure',
            });
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `Resolved — run ${context.runId} fetched successfully. Auto-closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

      # Non-fatal: the Ops Portal changing shape (new/renamed fields, new
      # status values, new bookingId formats) doesn't fail the run — data
      # still saves fine with the fields we know how to map — but it should
      # get noticed instead of silently accumulating unmapped data forever
      # (this is exactly how the 2026-07-10/11 full portal rebuild went
      # unnoticed for 18+ hours). Runs even if the job otherwise succeeded.
      - name: Report Ops Portal schema drift as GitHub issue
        if: always() && steps.fetch.outputs.schema_drift == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[Fetch] Ops Portal schema drift detected – ${new Date().toISOString().slice(0,16)} UTC`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'schema-drift',
            });
            if (issues.length === 0) {
              const summary = ${{ toJSON(steps.fetch.outputs.schema_drift_summary) }};
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title,
                body: [
                  `Detected in run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  '',
                  'Non-fatal warning(s) from this run — either the Ops Portal returned fields,',
                  'status values, or booking-id formats not in `scripts/fetch_schedule.py`\'s known',
                  'schema (review `REQUIRED_ENTRY_FIELDS`/`normalize_entry()`), or a date\'s fresh',
                  'fetch looked like a bad/blocked response and existing data was kept instead',
                  '(review the regression-guard note in `main()` — often self-resolves next run).',
                  '',
                  summary,
                ].join('\n'),
                labels: ['schema-drift'],
              });
            }

      # Auto-close a stale schema-drift issue once a run completes with NO
      # drift. Same gap, same reason, as the fetch-failure label (fixed
      # 2026-07-25), DB001's update-cache-failure and the dispatcher's
      # dispatcher-failure (both 2026-08-31/08-30): the dedup above means one
      # un-closed issue permanently swallows every future drift alert. Found
      # in the 2026-08-31 audit — issue #10 had been open since 08-29 doing
      # exactly that, saturated by benign booking-id warnings (now fixed at
      # source in fetch_schedule.py's _BOOKING_ID_RE).
      # NOTE the close condition is deliberately "ran, and found no drift" —
      # NOT plain success(). A successful run that still reports drift must
      # leave the issue open.
      - name: Close stale schema-drift issue when no drift found
        if: success() && steps.backoff.outputs.skip != 'true' && steps.fetch.outputs.schema_drift != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'schema-drift',
            });
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `Resolved — run ${context.runId} completed with no schema drift detected. Auto-closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
